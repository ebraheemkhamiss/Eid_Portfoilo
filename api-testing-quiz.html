<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>API testing quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#132033; --muted:#55627A; --line:#CBD3DF; --line-strong:#8B97AC;
  --accent:#2A3CD1; --accent-ink:#FFFFFF; --accent-soft:#E6E9FB;
  --ok:#0A7A4B; --ok-bg:#DDF3E8; --bad:#B42318; --bad-bg:#FBE4E1;
  --code-bg:#101B2D; --code-ink:#E4EAF5; --code-k:#8FB4FF; --code-s:#9FE0B8; --code-n:#FFC98A; --code-dim:#8A97AE;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1522; --surface:#161F30; --ink:#E6ECF6; --muted:#97A4BB; --line:#2B3750; --line-strong:#5C6B88;
    --accent:#8A9BFF; --accent-ink:#0E1522; --accent-soft:#1E2848;
    --ok:#5FD39B; --ok-bg:#123526; --bad:#FF8A80; --bad-bg:#3A1A1A;
    --code-bg:#0A1019;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1522; --surface:#161F30; --ink:#E6ECF6; --muted:#97A4BB; --line:#2B3750; --line-strong:#5C6B88;
  --accent:#8A9BFF; --accent-ink:#0E1522; --accent-soft:#1E2848;
  --ok:#5FD39B; --ok-bg:#123526; --bad:#FF8A80; --bad-bg:#3A1A1A;
  --code-bg:#0A1019;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:40px 20px 72px}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.4rem,4.6vw,1.75rem);font-weight:600;outline:none}
h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 1em;max-width:62ch}
.lead{font-size:1.1rem;color:var(--muted);margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
label.field{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line-strong);border-radius:10px;padding:12px 14px}
input[type=text]:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.93rem;margin:8px 0 0}
.error{color:var(--bad);font-weight:500;margin:10px 0 0;min-height:1.4em}
.btn{font:600 1rem var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 22px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.small{padding:9px 14px;font-size:.92rem}
.stack>*+*{margin-top:22px}
.rules{margin:28px 0 0;color:var(--muted);font-size:.98rem}
details.open-result{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
details summary{cursor:pointer;font-weight:600}
details .row{margin-top:14px}
.row{display:flex;gap:10px;align-items:stretch}
.row input{flex:1;min-width:0}

/* quiz */
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.93rem;margin-bottom:10px}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:28px}
.bar i{height:6px;border-radius:3px;background:var(--line)}
.bar i.done{background:var(--accent)}
.bar i.now{background:var(--line-strong)}
.q-code{margin:16px 0 0}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);font:400 .9rem/1.6 var(--mono);padding:16px 18px;border-radius:10px;overflow-x:auto;white-space:pre}
.opts{display:grid;gap:10px;margin:24px 0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--line-strong)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:600 .85rem var(--body);color:var(--muted)}
.opt .txt{padding-top:1px;overflow-wrap:anywhere}
.opt .txt.mono{font:400 .92rem/1.5 var(--mono);padding-top:3px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.actions .hint{margin:0}

/* result */
.response{background:var(--code-bg);color:var(--code-ink);border-radius:14px;overflow:hidden}
.response .status{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.12);font:500 .88rem var(--mono);color:var(--code-dim)}
.response .status b{color:var(--code-s);font-weight:500}
.response pre{margin:0;padding:18px;font:400 .95rem/1.7 var(--mono);overflow-x:auto;white-space:pre}
.k{color:var(--code-k)} .s{color:var(--code-s)} .n{color:var(--code-n)}
.share label{display:block;font-weight:600;margin:0 0 6px}
.share .row+label{margin-top:16px}
.share input{font:400 .85rem var(--mono)}
.review{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px}
.review li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.review .qt{font-weight:600;margin:0 0 10px}
.review .qn{color:var(--muted);font-weight:500;margin-right:6px}
.tag{display:inline-block;font-weight:600;font-size:.9rem;border-radius:6px;padding:2px 9px;margin-bottom:8px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.review p{margin:0 0 6px;font-size:.98rem}
.review .why{color:var(--muted)}
.mono-inline{font:400 .9em var(--mono);overflow-wrap:anywhere}
.notice{border-left:4px solid var(--line-strong);padding:4px 0 4px 14px;color:var(--muted);font-size:.95rem;margin:22px 0 0}
.top-note{margin-top:10px;color:var(--muted)}
@media (max-width:480px){
  main{padding-top:28px}
  .row{flex-direction:column}
  .panel{padding:18px}
}
@media (prefers-reduced-motion: no-preference){
  .bar i{transition:background .25s}
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
"use strict";
var QUESTIONS = [
  {t:"components", q:"Look at this request URL. Which part is the query parameter?",
   code:"https://api.shop.com/v1/products/42?currency=USD",
   o:["https://api.shop.com","/v1/products/42","currency=USD","products"], a:2,
   why:"Query parameters come after the ? and are written as key=value pairs. Here, currency is the key and USD is the value."},
  {t:"components", q:"In the same URL, what does the 42 represent?",
   code:"https://api.shop.com/v1/products/42?currency=USD",
   o:["A path parameter that identifies one product","A query parameter","A request header","A status code"], a:0,
   why:"42 sits inside the path, so it is a path parameter. It points to one specific product (the resource)."},
  {t:"components", q:"Which HTTP method is normally used to create a new resource?",
   o:["GET","POST","DELETE","PATCH"], a:1,
   why:"POST sends data to the server so it can create something new. GET reads data, DELETE removes it and PATCH updates part of it."},
  {t:"components", q:"Where does an API normally expect an authentication token, such as a Bearer token?",
   o:["In the status code","In the response body only","In the /v1 part of the path","In the request headers"], a:3,
   why:"Tokens travel in the Authorization header, for example Authorization: Bearer <token>. Headers carry information about the request."},
  {t:"components", q:"Which status code means a new resource was created successfully?",
   o:["204","301","201","200"], a:2,
   why:"201 Created is the specific code for a successful creation. 200 means a general success, 204 means success with no content, 301 is a redirect."},
  {t:"components", q:"The server answers with 401 Unauthorized. What is the most likely cause?",
   o:["The token is missing or invalid","The endpoint does not exist","The server has crashed","The response body is empty"], a:0,
   why:"401 means the server could not verify who you are, usually because the credentials are missing, expired or wrong. A missing endpoint gives 404 and a crash gives 5xx."},
  {t:"components", q:"Which statement about the request body is correct?",
   o:["It holds the status code returned by the server","It carries the data sent to the server, common in POST and PUT requests","It must be present in every GET request","It is where the endpoint URL is written"], a:1,
   why:"The body is the payload you send, such as the JSON for a new user. GET requests normally have no body."},
  {t:"components", q:"What is an endpoint?",
   o:["The database behind the API","The tool used to send requests","A specific URL where an API resource can be reached","The last line of a JSON file"], a:2,
   why:"An endpoint is a URL, combined with an HTTP method, that exposes one operation or resource, for example GET /v1/products/42."},

  {t:"importance", q:"Why can API testing start earlier than UI testing?",
   o:["APIs never contain bugs","The API layer can be called directly, before any user interface is built","UI tests are not allowed in early stages","APIs do not need test data"], a:1,
   why:"The backend can be tested with plain requests as soon as it exists. Bugs in business logic are found earlier and are cheaper to fix."},
  {t:"importance", q:"What is the main reason APIs are important in software?",
   o:["They make applications look better","They replace the need for databases","They let different systems talk to each other through a defined contract","They remove the need for authentication"], a:2,
   why:"An API is an agreed contract. Web apps, mobile apps and third-party services can all use the same backend without knowing how it works inside."},
  {t:"importance", q:"Why are API tests usually more stable than UI tests?",
   o:["They never fail","They run only once","They do not need a server","They check the logic directly, so layout and button changes do not break them"], a:3,
   why:"UI tests depend on screens, locators and timing. API tests only depend on the request and response, so they break less often and run faster."},

  {t:"json", q:"Which of these is valid JSON?",
   o:["{'name': 'Sara'}","{\"name\": \"Sara\"}","{name: \"Sara\"}","{\"name\": \"Sara\",}"], a:1, optCode:true,
   why:"JSON keys and text values must use double quotes. Single quotes, unquoted keys and a trailing comma are all invalid."},
  {t:"json", q:"Which of these is NOT a JSON data type?",
   o:["Array","null","Date","Boolean"], a:2,
   why:"JSON has string, number, boolean, null, object and array. Dates are sent as strings, for example \"2026-09-20\"."},
  {t:"json", q:"What is the value of user.roles[1] in this response?",
   code:"{\n  \"user\": {\n    \"id\": 7,\n    \"roles\": [\"admin\", \"tester\"]\n  }\n}",
   o:["\"tester\"","\"admin\"","7","[\"admin\", \"tester\"]"], a:0, optCode:true,
   why:"Array positions start at 0, so roles[0] is \"admin\" and roles[1] is \"tester\"."},
  {t:"json", q:"Which Content-Type header tells the server that the request body is JSON?",
   o:["text/plain","application/json","application/xml","text/html"], a:1, optCode:true,
   why:"Content-Type: application/json declares the body format, so the server knows how to parse it."}
];
var TOTAL = QUESTIONS.length;
var TOPICS = [
  {key:"components", label:"API components"},
  {key:"importance", label:"Importance of APIs"},
  {key:"json", label:"JSON"}
];
var KEY = "api-testing-quiz-v1";
var app = document.getElementById("app");
var memState = null;

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function load(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):memState}catch(e){return memState}}
function save(s){memState=s;try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch(e){return false}}
function storageWorks(){try{localStorage.setItem(KEY+"-t","1");localStorage.removeItem(KEY+"-t");return true}catch(e){return false}}
function b64(s){var bytes=new TextEncoder().encode(s),bin="";for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var bin=atob(s),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new TextDecoder().decode(arr)}
function chk(str){var h=0x811c9dc5,t=str+"|api-quiz";for(var i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16)}
function encode(s){var body=b64(JSON.stringify({n:s.name,a:s.answers,t:s.t}));return body+"."+chk(body)}
function decode(code){
  try{
    var i=code.lastIndexOf(".");if(i<1)return null;
    var body=code.slice(0,i);if(chk(body)!==code.slice(i+1))return null;
    var p=JSON.parse(unb64(body));
    if(typeof p.n!=="string"||p.n.length>80||!Array.isArray(p.a)||p.a.length!==TOTAL||!Number.isFinite(p.t))return null;
    for(var k=0;k<p.a.length;k++){if(!Number.isInteger(p.a[k])||p.a[k]<0||p.a[k]>3)return null}
    return {name:p.n,answers:p.a,t:p.t};
  }catch(e){return null}
}
function grade(answers){
  var score=0,by={};
  TOPICS.forEach(function(t){by[t.key]={got:0,of:0}});
  QUESTIONS.forEach(function(q,i){by[q.t].of++;if(answers[i]===q.a){score++;by[q.t].got++}});
  return {score:score,by:by,pct:Math.round(score/TOTAL*100)};
}
function baseUrl(){return location.href.split("#")[0]}
function copyText(text,btn,input){
  var done=function(){var o=btn.textContent;btn.textContent="Copied";setTimeout(function(){btn.textContent=o},1600)};
  var fallback=function(){try{input.focus();input.select();document.execCommand("copy");done()}catch(e){input.select()}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback)}else{fallback()}
}
function focusHeading(){var h=app.querySelector("h1,h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}window.scrollTo(0,0)}

/* ---------- views ---------- */
function showStart(msg){
  var warn=storageWorks()?"":'<p class="notice">This browser is blocking saved progress, so the one-attempt limit cannot be kept here. Please do not refresh the page during the quiz.</p>';
  app.innerHTML=
    '<div class="stack">'+
    '<div><h1>API testing quiz</h1>'+
    '<p class="lead">API components, why APIs matter, and JSON. '+TOTAL+' multiple-choice questions.</p></div>'+
    '<div class="panel">'+
      '<label class="field" for="name">Your name</label>'+
      '<input type="text" id="name" maxlength="60" autocomplete="name" dir="auto" placeholder="Full name">'+
      '<p class="error" id="err" role="alert">'+(msg?esc(msg):"")+'</p>'+
      '<button class="btn" id="start" type="button">Start quiz</button>'+
    '</div>'+
    '<p class="rules">You get one attempt. An answer locks when you press Next, and you can\u2019t go back. When you finish, you get a result link and code to send to your teacher.</p>'+
    warn+
    '<details class="open-result"><summary>Teacher: open a student\u2019s result</summary>'+
      '<div class="row"><input type="text" id="paste" placeholder="Paste result link or code" aria-label="Result link or code">'+
      '<button class="btn small" id="open" type="button">Open result</button></div>'+
      '<p class="error" id="err2" role="alert"></p>'+
    '</details></div>';
  var nameEl=document.getElementById("name"),err=document.getElementById("err");
  function start(){
    var name=nameEl.value.trim().replace(/\s+/g," ");
    if(name.length<2){err.textContent="Enter your name (at least 2 characters) to start.";nameEl.focus();return}
    var s={name:name,answers:[],done:false,t0:Date.now()};
    save(s);showQuiz(s);
  }
  document.getElementById("start").addEventListener("click",start);
  nameEl.addEventListener("keydown",function(e){if(e.key==="Enter")start()});
  document.getElementById("open").addEventListener("click",function(){
    var v=document.getElementById("paste").value.trim(),m=v.match(/#r=([^\s]+)/);
    var r=decode(m?m[1]:v);
    if(!r){document.getElementById("err2").textContent="That result code is not valid. Copy it again from the student\u2019s message.";return}
    showResult(r,"teacher");
  });
}

function showQuiz(s){
  var idx=s.answers.length;
  if(idx>=TOTAL){s.done=true;s.t=s.t||Date.now();save(s);return showResult(s,"own")}
  var q=QUESTIONS[idx],sel=null,topic=TOPICS.filter(function(t){return t.key===q.t})[0].label;
  var bar="";for(var i=0;i<TOTAL;i++)bar+='<i class="'+(i<idx?"done":i===idx?"now":"")+'"></i>';
  var opts=q.o.map(function(o,i){
    return '<label class="opt"><input type="radio" name="opt" value="'+i+'"><span class="key" aria-hidden="true">'+"ABCD"[i]+'</span><span class="txt'+(q.optCode?" mono":"")+'">'+esc(o)+'</span></label>';
  }).join("");
  app.innerHTML=
    '<div class="meta"><span>Question '+(idx+1)+' of '+TOTAL+'</span><span>'+esc(topic)+'</span></div>'+
    '<div class="bar" aria-hidden="true">'+bar+'</div>'+
    '<h2>'+esc(q.q)+'</h2>'+
    (q.code?'<div class="q-code"><pre class="code">'+esc(q.code)+'</pre></div>':"")+
    '<fieldset style="border:0;padding:0;margin:0"><legend class="sr" style="position:absolute;left:-9999px">Choose one answer</legend><div class="opts">'+opts+'</div></fieldset>'+
    '<div class="actions"><p class="hint">Answers lock when you press '+(idx===TOTAL-1?"Finish":"Next")+'.</p>'+
    '<button class="btn" id="next" type="button" disabled>'+(idx===TOTAL-1?"Finish quiz":"Next")+'</button></div>';
  var next=document.getElementById("next");
  app.querySelectorAll('input[name="opt"]').forEach(function(r){
    r.addEventListener("change",function(){sel=Number(r.value);next.disabled=false});
  });
  next.addEventListener("click",function(){
    if(sel===null)return;
    s.answers.push(sel);
    if(s.answers.length===TOTAL){s.done=true;s.t=Date.now()}
    save(s);
    showQuiz(s);
  });
  focusHeading();
}

function jsonPanel(name,g,t){
  var K=function(x){return '<span class="k">"'+x+'"</span>'},S=function(x){return '<span class="s">"'+esc(x)+'"</span>'},N=function(x){return '<span class="n">'+x+'</span>'};
  var topics=TOPICS.map(function(tp,i){return "    "+K(tp.key)+": "+S(g.by[tp.key].got+"/"+g.by[tp.key].of)+(i<TOPICS.length-1?",":"")}).join("\n");
  var body="{\n  "+K("student")+': <span dir="auto">'+S(name)+"</span>,\n  "+K("score")+": "+N(g.score)+",\n  "+K("total")+": "+N(TOTAL)+",\n  "+K("percent")+": "+N(g.pct)+",\n  "+K("topics")+": {\n"+topics+"\n  },\n  "+K("completedAt")+": "+S(new Date(t).toISOString().slice(0,16).replace("T"," ")+" UTC")+"\n}";
  return '<div class="response"><div class="status"><b>HTTP/1.1 200 OK</b><span>quiz result</span></div><pre>'+body+'</pre></div>';
}

function reviewList(answers){
  return '<ol class="review">'+QUESTIONS.map(function(q,i){
    var ok=answers[i]===q.a,cls=q.optCode?"mono-inline":"";
    return '<li><p class="qt"><span class="qn">'+(i+1)+'.</span>'+esc(q.q)+'</p>'+
      (q.code?'<pre class="code" style="margin-bottom:12px">'+esc(q.code)+'</pre>':"")+
      '<span class="tag '+(ok?"ok":"bad")+'">'+(ok?"\u2713 Correct":"\u2717 Incorrect")+'</span>'+
      '<p>Answer given: <span class="'+cls+'">'+esc(q.o[answers[i]])+'</span></p>'+
      (ok?"":'<p>Correct answer: <span class="'+cls+'">'+esc(q.o[q.a])+'</span></p>')+
      '<p class="why">'+esc(q.why)+'</p></li>';
  }).join("")+'</ol>';
}

function showResult(s,mode){
  var g=grade(s.answers),t=s.t||Date.now(),html;
  if(mode==="own"){
    var code=encode({name:s.name,answers:s.answers,t:t}),link=baseUrl()+"#r="+code;
    html=
      '<div class="stack"><div><h2>You finished, '+esc(s.name)+'.</h2>'+
      '<p class="top-note">This was your one attempt. Send the link or code below to your teacher so they can see your result.</p></div>'+
      jsonPanel(s.name,g,t)+
      '<div class="panel share"><h3 style="margin-bottom:14px">Send your result to your teacher</h3>'+
        '<label for="lnk">Result link</label><div class="row"><input type="text" id="lnk" readonly value="'+esc(link)+'"><button class="btn small" id="cl" type="button">Copy link</button></div>'+
        '<label for="cod">Result code</label><div class="row"><input type="text" id="cod" readonly value="'+esc(code)+'"><button class="btn small" id="cc" type="button">Copy code</button></div>'+
        '<p class="hint">If the link does not open your result, your teacher can paste the code into \u201cOpen a result\u201d on the quiz page.</p>'+
      '</div>'+
      '<div><h3>Review your answers</h3>'+reviewList(s.answers)+'</div></div>';
    app.innerHTML=html;
    document.getElementById("cl").addEventListener("click",function(){copyText(link,this,document.getElementById("lnk"))});
    document.getElementById("cc").addEventListener("click",function(){copyText(code,this,document.getElementById("cod"))});
  }else{
    app.innerHTML=
      '<div class="stack"><div><h2>Result for <span dir="auto">'+esc(s.name)+'</span></h2>'+
      '<p class="top-note">The score is recalculated from the answers the student submitted.</p></div>'+
      jsonPanel(s.name,g,t)+
      '<div><h3>Answer review</h3>'+reviewList(s.answers)+'</div>'+
      '<div><button class="btn ghost" id="back" type="button">Go to quiz page</button></div></div>';
    document.getElementById("back").addEventListener("click",function(){
      if(location.hash){history.replaceState(null,"",baseUrl())}
      route();
    });
  }
  focusHeading();
}

function route(){
  var m=location.hash.match(/^#r=(.+)$/);
  if(m){
    var r=decode(m[1]);
    if(r)return showResult(r,"teacher");
    return showStart("That result link is not valid. Ask the student to copy it again.");
  }
  var s=load();
  if(s&&s.done)return showResult(s,"own");
  if(s&&s.name)return showQuiz(s);
  showStart();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
